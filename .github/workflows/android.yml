name: Build AimHub APK

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      app_url:
        description: "رابط AimHub المنشور"
        required: false
        type: string
        default: ""

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل المشروع
        uses: actions/checkout@v4

      - name: إعداد Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: إعداد Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: إعداد Android SDK
        uses: android-actions/setup-android@v3

      - name: تثبيت الحزم
        run: bun install --frozen-lockfile

      - name: تحديد رابط AimHub
        id: appurl
        shell: bash
        run: |
          set -e

          INPUT_URL="${{ github.event.inputs.app_url }}"
          INPUT_URL="$(printf '%s' "$INPUT_URL" | xargs || true)"

          if [ -n "$INPUT_URL" ]; then
            APP_URL="$INPUT_URL"
          else
            APP_URL="https://project--d7d72102-37b0-42bc-a4d3-da166e8af56e.lovable.app"
          fi

          case "$APP_URL" in
            http://*|https://*)
              ;;
            *)
              echo "خطأ: AIMHUB_APP_URL يجب أن يبدأ بـ http:// أو https://"
              echo "القيمة الحالية: $APP_URL"
              exit 1
              ;;
          esac

          echo "APP_URL=$APP_URL" >> "$GITHUB_ENV"

          echo "رابط AimHub:"
          echo "$APP_URL"

      - name: تجهيز Web assets
        run: |
          set -e

          rm -rf dist
          mkdir -p dist/client

          cat > dist/client/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8">
              <meta
                name="viewport"
                content="width=device-width, initial-scale=1.0"
              >
              <title>AimHub</title>
            </head>

            <body>
              <div id="root">Loading AimHub...</div>
            </body>
          </html>
          EOF

          test -f dist/client/index.html

          echo "Web assets جاهزة."

      - name: تنظيف Android القديم
        run: |
          rm -rf android

      - name: إنشاء مشروع Android
        env:
          AIMHUB_APP_URL: ${{ env.APP_URL }}
        run: |
          set -e

          echo "AIMHUB_APP_URL=$AIMHUB_APP_URL"

          if [ -z "$AIMHUB_APP_URL" ]; then
            echo "خطأ: AIMHUB_APP_URL فارغ."
            exit 1
          fi

          bunx cap add android

      - name: إعداد Android للإنترنت
        run: |
          set -e

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "AndroidManifest.xml غير موجود."
            exit 1
          fi

          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i '/<manifest[^>]*>/a\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
          fi

          echo "تم التأكد من INTERNET permission."

      - name: مزامنة Capacitor
        env:
          AIMHUB_APP_URL: ${{ env.APP_URL }}
        run: |
          set -e

          echo "Synchronizing Capacitor..."
          echo "AIMHUB_APP_URL=$AIMHUB_APP_URL"

          bunx cap sync android

      - name: التحقق من Capacitor
        run: |
          set -e

          echo "===== capacitor.config.ts ====="
          cat capacitor.config.ts

          echo ""
          echo "===== Android project ====="

          test -f android/gradlew

          echo "Android project موجود."

      - name: التحقق من URL داخل إعدادات Capacitor
        run: |
          set -e

          echo "البحث عن إعدادات AimHub داخل Android..."

          grep -R "d7d72102-37b0-42bc-a4d3-da166e8af56e" android \
            || echo "الرابط الافتراضي غير موجود كنص مباشر، وهذا طبيعي حسب طريقة Capacitor."

          echo ""
          echo "فحص AndroidManifest:"
          grep -n "INTERNET" android/app/src/main/AndroidManifest.xml || true

      - name: تجهيز Gradle
        run: |
          chmod +x android/gradlew

      - name: تنظيف Gradle
        working-directory: android
        run: |
          ./gradlew clean --no-daemon

      - name: بناء APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: التحقق من APK
        run: |
          set -e

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK غير موجود."

            echo ""
            echo "APK files:"
            find android -type f -name "*.apk" -print || true

            exit 1
          fi

          echo ""
          echo "===== APK SUCCESS ====="
          ls -lh "$APK"

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: AimHub-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
