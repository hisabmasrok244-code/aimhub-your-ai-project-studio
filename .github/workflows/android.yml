name: Build AimHub APK

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      app_url:
        description: "رابط AimHub المنشور"
        required: false
        default: ""

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      # ==============================
      # 1. تحميل المشروع
      # ==============================
      - name: تحميل المشروع
        uses: actions/checkout@v4

      # ==============================
      # 2. إعداد Bun
      # ==============================
      - name: إعداد Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # ==============================
      # 3. إعداد Java
      # ==============================
      - name: إعداد Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ==============================
      # 4. إعداد Android SDK
      # ==============================
      - name: إعداد Android SDK
        uses: android-actions/setup-android@v3

      # ==============================
      # 5. تثبيت Dependencies
      # ==============================
      - name: تثبيت الحزم
        run: bun install --frozen-lockfile

      # ==============================
      # 6. إنشاء مجلد Web حقيقي
      # ==============================
      # AimHub تطبيق Server-rendered ويستخدم
      # server.url الموجود في capacitor.config.ts.
      # Capacitor يحتاج webDir موجودًا فقط أثناء sync.
      - name: تجهيز Web assets لـ Capacitor
        run: |
          set -e

          rm -rf dist
          mkdir -p dist/client

          cat > dist/client/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8">
              <meta
                name="viewport"
                content="width=device-width, initial-scale=1.0"
              >
              <title>AimHub</title>
            </head>
            <body>
              <p>Loading AimHub...</p>
            </body>
          </html>
          EOF

          test -f dist/client/index.html

          echo "Web assets جاهزة."

      # ==============================
      # 7. حذف Android القديم
      # ==============================
      # لا نعتمد على Android project قديم أو ناقص.
      - name: تنظيف Android القديم
        run: |
          rm -rf android

      # ==============================
      # 8. إنشاء Android من جديد
      # ==============================
      - name: إنشاء مشروع Android
        env:
          AIMHUB_APP_URL: ${{ github.event.inputs.app_url || vars.AIMHUB_APP_URL }}
        run: |
          set -e

          bunx cap add android

      # ==============================
      # 9. إضافة صلاحية الإنترنت
      # ==============================
      - name: إعداد Android للإنترنت
        run: |
          set -e

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<manifest[^>]*>/a\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
          fi

          echo "AndroidManifest:"
          cat "$MANIFEST"

      # ==============================
      # 10. Sync Capacitor
      # ==============================
      - name: مزامنة Capacitor
        env:
          AIMHUB_APP_URL: ${{ github.event.inputs.app_url || vars.AIMHUB_APP_URL }}
        run: |
          set -e

          bunx cap sync android

      # ==============================
      # 11. التحقق من رابط AimHub
      # ==============================
      - name: التحقق من إعداد AimHub
        run: |
          echo "Capacitor configuration:"
          cat capacitor.config.ts

          echo ""
          echo "Android project:"
          test -f android/gradlew

      # ==============================
      # 12. إعطاء صلاحية تنفيذ Gradle
      # ==============================
      - name: تجهيز Gradle
        run: |
          chmod +x android/gradlew

      # ==============================
      # 13. بناء APK
      # ==============================
      - name: بناء APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      # ==============================
      # 14. التأكد من APK
      # ==============================
      - name: التحقق من APK
        run: |
          set -e

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK غير موجود."
            echo ""
            echo "APK files الموجودة:"
            find android -type f -name "*.apk" -print || true
            exit 1
          fi

          echo "APK تم إنشاؤه بنجاح:"
          ls -lh "$APK"

      # ==============================
      # 15. رفع APK
      # ==============================
      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: AimHub-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
