name: Build AimHub APK

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      app_url:
        description: "AimHub deployed URL"
        required: false
        default: ""

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # AimHub Android is a Capacitor shell that loads
      # the deployed AimHub URL from capacitor.config.ts.
      # Capacitor still requires webDir to exist during sync.
      - name: Prepare Capacitor web directory
        shell: bash
        run: |
          set -e

          rm -rf dist
          mkdir -p dist/client

          cat > dist/client/index.html <<'EOF'
          <!doctype html>
          <html>
            <head>
              <meta charset="UTF-8" />
              <meta
                name="viewport"
                content="width=device-width, initial-scale=1.0"
              />
              <title>AimHub</title>
            </head>
            <body>
              <div id="root">Loading AimHub...</div>
            </body>
          </html>
          EOF

          echo "Capacitor web directory prepared:"
          ls -la dist/client

      - name: Add Android platform
        env:
          AIMHUB_APP_URL: ${{ github.event.inputs.app_url || vars.AIMHUB_APP_URL }}
        shell: bash
        run: |
          set -e

          if [ ! -d "android" ]; then
            bunx cap add android
          else
            echo "Android platform already exists."
          fi

      - name: Sync Capacitor
        env:
          AIMHUB_APP_URL: ${{ github.event.inputs.app_url || vars.AIMHUB_APP_URL }}
        run: |
          set -e
          bunx cap sync android

      - name: Verify Android project
        run: |
          test -d android
          test -f android/gradlew
          chmod +x android/gradlew

      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK was not generated."
            find android -type f -name "*.apk" -print || true
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aimhub-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
